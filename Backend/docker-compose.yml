services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: etherroad
      POSTGRES_USER: etherroad
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    ports:
      - "5432:5432"
    volumes:
      - etherroad_pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etherroad -d etherroad"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      PORT: 8080
      HOST: 0.0.0.0
      DATABASE_URL: postgres://etherroad:${POSTGRES_PASSWORD:-local-only-change-me}@postgres:5432/etherroad
      NODE_ENV: development
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  etherroad_pgdata:
